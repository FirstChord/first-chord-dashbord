name: Stripe Amounts Cache

# Locks the current Stripe_Forecast_Monthly row before any provider read, then
# refreshes the per-student subscription cache and prior-month collection reveal.
# Runs on the 1st at 05:15 UTC so the completed prior month appears promptly, and
# Mondays 05:30 before the weekly finance snapshot. Forecast is first-write-wins;
# actuals are refreshable caches. A forecast-lock failure fails closed before
# Stripe, while a later provider failure leaves the previous caches intact.

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 1 * *" # prior-month collection actuals before monthly finance review
    - cron: "30 5 * * 1" # Mondays 05:30 UTC, ahead of the 06:00 finance snapshot

concurrency:
  group: stripe-amounts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh Stripe amounts cache
        env:
          ENDPOINT: https://first-chord-dashbord-production.up.railway.app/api/cron/stripe-amounts
          SECRET: ${{ secrets.FINANCE_SNAPSHOT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET}" ]; then
            echo "FINANCE_SNAPSHOT_SECRET is not set in repo secrets"; exit 1
          fi
          resp=$(curl -sS -X POST "${ENDPOINT}" \
            -H "x-firstchord-finance-secret: ${SECRET}" \
            -H "content-type: application/json" \
            --max-time 300)
          echo "Response: ${resp}"
          ok=$(echo "${resp}" | jq -r '.success // false')
          if [ "${ok}" != "true" ]; then
            echo "Endpoint returned an error"; exit 1
          fi
